<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#060E18" />
  
  <!-- Subtle technical grid -->
  <defs>
    <pattern id="gridAtlas" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <linearGradient id="glowBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#1769FF" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#050B12" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#5CFFD0" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#1769FF" stopOpacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#gridAtlas)" />
  <circle cx="850" cy="350" r="320" fill="url(#glowBlue)" filter="blur(60px)" />

  <!-- Top Mockup Navigation Bar -->
  <rect x="60" y="50" width="1080" height="60" rx="8" fill="#0A1624" stroke="rgba(255,255,255,0.08)" />
  <circle cx="95" cy="80" r="6" fill="#FF5F56" />
  <circle cx="115" cy="80" r="6" fill="#FFBD2E" />
  <circle cx="135" cy="80" r="6" fill="#27C93F" />

  <text x="175" y="86" fill="#F5F7FA" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="2">ATLAS ASCENSEURS</text>
  <text x="640" y="85" fill="#8C98A8" font-family="sans-serif" font-size="13">SOLUTIONS</text>
  <text x="750" y="85" fill="#8C98A8" font-family="sans-serif" font-size="13">TECHNOLOGIES</text>
  <text x="880" y="85" fill="#8C98A8" font-family="sans-serif" font-size="13">NORMES EN 81</text>
  <rect x="1000" y="66" width="120" height="28" rx="4" fill="#1769FF" />
  <text x="1025" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">CONTACT</text>

  <!-- Left Hero Content -->
  <text x="90" y="210" fill="#5CFFD0" font-family="monospace" font-size="12" letter-spacing="3">INGÉNIERIE D'ÉLÉVATION VERTICALE</text>
  <text x="90" y="275" fill="#F5F7FA" font-family="sans-serif" font-size="44" font-weight="800" line-height="1.1">
    La précision mécanique<tspan x="90" y="325">au service de l'architecture.</tspan>
  </text>
  <text x="90" y="380" fill="#8C98A8" font-family="sans-serif" font-size="16">
    Conception, installation sur-mesure et maintenance certifiée d'ascenseurs
  </text>
  <text x="90" y="405" fill="#8C98A8" font-family="sans-serif" font-size="16">
    résidentiels de luxe et monte-charges industriels.
  </text>

  <!-- Feature Tags -->
  <rect x="90" y="450" width="130" height="34" rx="4" fill="#0E2238" stroke="#1769FF" stroke-opacity="0.4" />
  <text x="105" y="472" fill="#F5F7FA" font-family="monospace" font-size="12">EN 81-20 / 50</text>

  <rect x="235" y="450" width="130" height="34" rx="4" fill="#0E2238" stroke="rgba(255,255,255,0.1)" />
  <text x="252" y="472" fill="#F5F7FA" font-family="monospace" font-size="12">GEARLESS PMSM</text>

  <rect x="380" y="450" width="120" height="34" rx="4" fill="#0E2238" stroke="rgba(255,255,255,0.1)" />
  <text x="400" y="472" fill="#5CFFD0" font-family="monospace" font-size="12">VERCEL LIVE</text>

  <!-- Elevator Shaft & Cabin Technical Graphic -->
  <g transform="translate(680, 160)">
    <!-- Shaft column frame -->
    <rect x="40" y="20" width="360" height="480" rx="12" fill="#081422" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Guide Rails -->
    <line x1="80" y1="20" x2="80" y2="500" stroke="#1769FF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 4" />
    <line x1="360" y1="20" x2="360" y2="500" stroke="#1769FF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Elevator Glass Cabin Mockup -->
    <rect x="95" y="140" width="250" height="260" rx="8" fill="#0E243A" stroke="#1769FF" stroke-width="2" />
    <rect x="110" y="155" width="220" height="230" rx="6" fill="#091828" stroke="rgba(255,255,255,0.06)" />
    
    <!-- Interior Lighting Beam -->
    <line x1="120" y1="170" x2="320" y2="170" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" />
    <rect x="190" y="210" width="60" height="150" rx="4" fill="#050E1A" stroke="rgba(255,255,255,0.1)" />
    <circle cx="220" cy="270" r="14" fill="#1769FF" fill-opacity="0.2" stroke="#1769FF" stroke-width="1.5" />
    <text x="216" y="275" fill="#5CFFD0" font-family="sans-serif" font-size="14" font-weight="bold">A</text>

    <!-- Telemetry Cards -->
    <rect x="230" y="70" width="190" height="60" rx="6" fill="#050B12" stroke="#2ECC71" stroke-opacity="0.4" />
    <text x="245" y="93" fill="#8C98A8" font-family="monospace" font-size="10">VITESSE D'ÉLÉVATION</text>
    <text x="245" y="116" fill="#2ECC71" font-family="monospace" font-size="18" font-weight="bold">2.5 m/s <tspan font-size="12" fill="#8C98A8">• STABLE</tspan></text>

    <rect x="20" y="410" width="180" height="60" rx="6" fill="#050B12" stroke="#1769FF" stroke-opacity="0.4" />
    <text x="35" y="433" fill="#8C98A8" font-family="monospace" font-size="10">CHARGE MAXIMALE</text>
    <text x="35" y="456" fill="#F5F7FA" font-family="monospace" font-size="18" font-weight="bold">1 600 KG</text>
  </g>

  <!-- Live Deployment Watermark Footer -->
  <line x1="60" y1="670" x2="1140" y2="670" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="705" fill="#8C98A8" font-family="monospace" font-size="12">URL: https://atlas-ascenseur.vercel.app/</text>
  <text x="960" y="705" fill="#2ECC71" font-family="monospace" font-size="12">● 99.9% UPTIME • VERCEL EDGE</text>
</svg>
